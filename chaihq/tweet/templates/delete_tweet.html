{% extends "base.html" %}


{% block title %}
Delete Tweet
{% endblock %}

{% block content %}
<div class="mx-auto max-w-7xl px-4 py-8">
  <div class="rounded-md bg-gray-800 p-4">
    <h1 class="text-5xl font-medium">Delete Tweet</h1>
    <p class="mt-4 text-gray-300">Are you sure you want to delete this tweet?</p>
    <p class="mt-3 text-white">{{ tweet.text }}</p>

    <form class="mt-6 flex space-x-4" method="post">
      {% csrf_token %}
      <button class="btn" type="submit">Delete</button>
      <a class="rounded-md px-4 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white" href="{% url 'tweet_detail' tweet.id %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
