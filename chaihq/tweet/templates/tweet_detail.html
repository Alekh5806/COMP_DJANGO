{% extends "base.html" %}


{% block title %}
Tweet Detail
{% endblock %}

{% block content %}
<div class="mx-auto max-w-7xl px-4 py-8">
  <article class="rounded-md bg-gray-800 p-4">
    <div class="flex items-center justify-between">
      <p class="text-sm text-gray-300">@{{ tweet.user.username }}</p>
      <p class="text-sm text-gray-400">{{ tweet.created_at|date:"M d, Y H:i" }}</p>
    </div>
    <p class="mt-3 text-base text-white">{{ tweet.text }}</p>
    {% if tweet.photo %}
      <img class="mt-4 rounded-md" src="{{ tweet.photo.url }}" alt="Tweet photo">
    {% endif %}
    <div class="mt-4 flex space-x-4">
      <a class="text-sm text-indigo-500 hover:text-indigo-600" href="{% url 'index' %}">Back</a>
      {% if user == tweet.user %}
        <a class="text-sm text-indigo-500 hover:text-indigo-600" href="{% url 'tweet_edit' tweet.id %}">Edit</a>
        <a class="text-sm text-indigo-500 hover:text-indigo-600" href="{% url 'tweet_delete' tweet.id %}">Delete</a>
      {% endif %}
    </div>
  </article>
</div>
{% endblock %}
