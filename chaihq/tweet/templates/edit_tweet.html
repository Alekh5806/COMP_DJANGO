{% extends "base.html" %}


{% block title %}
Edit Tweet
{% endblock %}

{% block content %}
<div class="mx-auto max-w-7xl px-4 py-8">
  <h1 class="text-5xl font-medium">Edit Tweet</h1>

  <form class="mt-6 space-y-4" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex space-x-4">
      <button class="btn" type="submit">Save</button>
      <a class="rounded-md px-4 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white" href="{% url 'tweet_detail' form.instance.id %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
